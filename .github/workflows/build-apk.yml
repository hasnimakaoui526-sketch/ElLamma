name: Build El Lamma APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ElLamma_Release_v9_friends.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir buildsrc
          unzip -q ElLamma_Release_v9_friends.zip -d buildsrc
          cp -R buildsrc/app .
          cp buildsrc/build.gradle .
          cp buildsrc/settings.gradle .
          cp buildsrc/gradle.properties .

      - name: Fix API and Logout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("buildsrc/app/src/main/assets/el-lamma-chat.html")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r"""const API=['"][^'"]+['"]""",
              "const API='https://bfbzgzletoaxyazugjex.supabase.co/functions/v1/api'",
              s,
              count=1
          )

          s = s.replace(
              "let LOCAL_MODE=DIRECT_FILE;",
              "let LOCAL_MODE=false;"
          )

          s = s.replace(
              ".bottom.registration-hidden #bottomLogout{display:none!important}",
              ".bottom.registration-hidden #bottomLogout{display:flex!important}"
          )

          old_logout = """$('bottomLogout').onclick=()=>{
  const u=currentUser();
  if(u&&u.guest!==true)return;
  showLogin();
  $('authChoice').classList.add('hidden');
  $('registerPanel').classList.add('show');
  $('registerError').textContent='';
  $('registerName').focus()
};"""

          new_logout = """$('bottomLogout').onclick=()=>{
  logout()
};"""

          if old_logout in s:
              s = s.replace(old_logout, new_logout, 1)

          old_function = """async function logout(){
  try{"""

          new_function = """async function logout(){
  if(!confirm('هل تريد تسجيل الخروج من هذا الحساب؟'))return;
  try{"""

          if old_function in s:
              s = s.replace(old_function, new_function, 1)

          p.write_text(s, encoding="utf-8")

          print("API and logout patch applied successfully.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -1)
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER"

      - name: Install Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: el-lamma-apk-logout-fix
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
