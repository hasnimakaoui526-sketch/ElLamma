name: Build El Lamma APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ElLamma_Release_v1.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir buildsrc
          unzip -q ElLamma_Release_v1.zip -d buildsrc
          cp -R buildsrc/app .
          cp buildsrc/build.gradle .
          cp buildsrc/settings.gradle .
          cp buildsrc/gradle.properties .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: el-lamma-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
